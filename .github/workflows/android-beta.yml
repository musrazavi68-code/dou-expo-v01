name: Dou Expo Android Beta
on:
  workflow_dispatch:
  push:
    branches: [ "dou-expo-beta-1.0.0" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beta-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beta-app/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run prebuild:android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Dou-Expo-Beta-1.0.0-APK
          path: beta-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
