name: Dou Expo V2 Android APK
on:
  push:
    branches: [dou-expo-v2-blendcamera, dou-expo-android8-compat]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build Dou Expo V2 installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Diagnose Expo Android autolinking
        run: |
          echo '--- Expo and native module versions ---'
          npm ls expo expo-modules-autolinking expo-modules-core --all || true
          echo '--- Android autolinking search ---'
          npx expo-modules-autolinking search --platform android || true
          echo '--- Android autolinking resolution ---'
          npx expo-modules-autolinking resolve --platform android || true
      - name: Validate Expo project
        run: npx expo install --check
      - name: Bundle Android JavaScript
        run: npx expo export --platform android --output-dir dist-check
      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android --clean
      - name: Configure all Android ABIs
        run: |
          if grep -q '^reactNativeArchitectures=' android/gradle.properties; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/' android/gradle.properties
          else
            echo 'reactNativeArchitectures=armeabi-v7a,arm64-v8a' >> android/gradle.properties
          fi
          echo '--- Required native ABIs ---'
          grep '^reactNativeArchitectures=' android/gradle.properties
      - name: Build debug APK
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --stacktrace assembleDebug
      - name: Collect APK
        run: |
          mkdir -p artifacts
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" artifacts/Dou-Expo-V2.2.2-debug.apk
          test -s artifacts/Dou-Expo-V2.2.2-debug.apk
          echo "APK size: $(stat -c%s artifacts/Dou-Expo-V2.2.2-debug.apk) bytes"
          APK="$PWD/artifacts/Dou-Expo-V2.2.2-debug.apk"
          echo '--- APK native ABI inventory ---'
          unzip -Z1 "$APK" | awk -F/ '$1 == "lib" {print $2}' | sort -u
          APK_ENTRIES="$(unzip -Z1 "$APK")"
          for ABI in armeabi-v7a arm64-v8a; do
            echo "$APK_ENTRIES" | grep -q "^lib/$ABI/" || { echo "Missing required ABI: $ABI"; exit 1; }
          done
          echo 'Both Android phone ABIs are present.'
          ABI_LIST="$(echo "$APK_ENTRIES" | awk -F/ '$1 == "lib" {print $2}' | sort -u | tr '\n' ' ')"
          echo "Packaged Android phone ABIs: $ABI_LIST"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_DIR/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1)"
          AAPT="$(find "$SDK_DIR/build-tools" -type f \( -name aapt -o -name aapt2 \) 2>/dev/null | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)"
          echo "$BADGING" | grep -q "package: name='com.mrazavi.douexpo.v2' versionCode='24' versionName='2.2.2'" || { echo 'Unexpected application identity or version'; exit 1; }
          APKANALYZER="$(find "$SDK_DIR" -type f -name apkanalyzer 2>/dev/null | head -1)"
          test -n "$APKANALYZER"
          MIN_SDK="$("$APKANALYZER" manifest min-sdk "$APK")"
          echo "APK minimum Android SDK: $MIN_SDK"
          test "$MIN_SDK" = "26" || { echo "Expected minimum SDK 26 (Android 8.0), got: $MIN_SDK"; exit 1; }
          echo 'Install compatibility gate passed: Android 8.0+, package identity and native ABIs verified.'
          ZIPALIGN="$(find "$SDK_DIR/build-tools" -type f -name zipalign 2>/dev/null | sort -V | tail -1)"
          test -n "$ZIPALIGN"
          "$ZIPALIGN" -c -v 4 "$APK"
          sha256sum "$APK" > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Dou-Expo-V2.2.2-Android-APK
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
