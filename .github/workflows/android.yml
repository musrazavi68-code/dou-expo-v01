name: Dou Expo 2.3.0 Android Build
on:
  push:
    branches: [dou-expo-v2.3.0-rebuild, duo-shot-android-v4]
    tags: ['v2.3.0']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dou-expo-2.3.0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and verify Dou Expo 2.3.0 APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Validate Expo project
        run: npx expo install --check
      - name: Bundle Android JavaScript
        run: npx expo export --platform android --output-dir dist-check
      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android --clean
      - name: Configure supported phone ABIs
        run: |
          if grep -q '^reactNativeArchitectures=' android/gradle.properties; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/' android/gradle.properties
          else
            echo 'reactNativeArchitectures=armeabi-v7a,arm64-v8a' >> android/gradle.properties
          fi
      - name: Build debug APK
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --stacktrace assembleDebug
      - name: Verify APK identity, SDK, ABIs and alignment
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" artifacts/Dou-Expo-v2.3.0-debug.apk
          APK="$PWD/artifacts/Dou-Expo-v2.3.0-debug.apk"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_DIR/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$SDK_DIR/build-tools" -type f \( -name aapt -o -name aapt2 \) | sort -V | tail -1)"
          APKANALYZER="$(find "$SDK_DIR" -type f -name apkanalyzer | head -1)"
          ZIPALIGN="$(find "$SDK_DIR/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -n "$APKSIGNER"; test -n "$AAPT"; test -n "$APKANALYZER"; test -n "$ZIPALIGN"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)'
          echo "$BADGING" | grep -q "package: name='com.mrazavi.douexpo.v2' versionCode='25' versionName='2.3.0'"
          MIN_SDK="$("$APKANALYZER" manifest min-sdk "$APK")"
          test "$MIN_SDK" = "26"
          ENTRIES="$(unzip -Z1 "$APK")"
          for ABI in armeabi-v7a arm64-v8a; do echo "$ENTRIES" | grep -q "^lib/$ABI/"; done
          "$ZIPALIGN" -c -v 4 "$APK"
          sha256sum "$APK" > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Dou-Expo-v2.3.0-Android-APK
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Dou Expo v2.3.0
          generate_release_notes: true
          files: |
            artifacts/Dou-Expo-v2.3.0-debug.apk
            artifacts/SHA256SUMS.txt
