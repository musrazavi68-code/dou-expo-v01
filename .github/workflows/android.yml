name: Dou Expo V2 Android APK
on:
  push:
    branches: [dou-expo-v2-blendcamera]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dou-expo-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build Dou Expo V2 installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Collect APK
        run: |
          mkdir -p artifacts
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" artifacts/Dou-Expo-V2-debug.apk
          sha256sum artifacts/Dou-Expo-V2-debug.apk > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Dou-Expo-V2-Android-APK
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
