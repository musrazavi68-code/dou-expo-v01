name: Build Dou Expo Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dou-expo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify source package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="Dou_Expo_GitHub_Ready_v1.3.0.zip"
          CHECKSUM_FILE="DOU_EXPO_v1.3.0_SHA256SUMS.txt"

          if [[ ! -f "$SOURCE_ZIP" ]]; then
            echo "::error::Source archive not found: $SOURCE_ZIP"
            exit 1
          fi

          if [[ ! -f "$CHECKSUM_FILE" ]]; then
            echo "::error::Checksum file not found: $CHECKSUM_FILE"
            exit 1
          fi

          grep "  $SOURCE_ZIP$" "$CHECKSUM_FILE" | sha256sum --check -

      - name: Extract Dou Expo source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q "Dou_Expo_GitHub_Ready_v1.3.0.zip" -d source

          echo "Extracted source files:"
          find source -maxdepth 3 -type f | sort | head -200

      - name: Locate project and detect Expo configuration
        id: project
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_SETTINGS="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit || true)"
          PACKAGE_FILE="$(find source -type f -name package.json -not -path '*/node_modules/*' -print -quit || true)"

          if [[ -n "$GRADLE_SETTINGS" ]]; then
            PROJECT_DIR="$(dirname "$GRADLE_SETTINGS")"
          elif [[ -n "$PACKAGE_FILE" ]]; then
            PROJECT_DIR="$(dirname "$PACKAGE_FILE")"
          else
            echo "::error::Could not find settings.gradle or package.json inside the source archive."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

          if [[ -n "$PACKAGE_FILE" ]]; then
            PACKAGE_DIR="$(dirname "$PACKAGE_FILE")"
            echo "package_dir=$PACKAGE_DIR" >> "$GITHUB_OUTPUT"
            if grep -q '"expo"' "$PACKAGE_FILE"; then
              echo "is_expo=true" >> "$GITHUB_OUTPUT"
              echo "Expo project detected."
            else
              echo "is_expo=false" >> "$GITHUB_OUTPUT"
              echo "package.json found; Expo dependency not detected."
            fi
          else
            echo "package_dir=" >> "$GITHUB_OUTPUT"
            echo "is_expo=false" >> "$GITHUB_OUTPUT"
            echo "Native Gradle project detected."
          fi

      - name: Setup Node.js
        if: steps.project.outputs.package_dir != ''
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.project.outputs.package_dir }}/package-lock.json

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        if: steps.project.outputs.package_dir != ''
        working-directory: ${{ steps.project.outputs.package_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Generate Android project for Expo (when needed)
        if: steps.project.outputs.is_expo == 'true'
        working-directory: ${{ steps.project.outputs.package_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f android/gradlew && ! -f android/settings.gradle && ! -f android/settings.gradle.kts ]]; then
            npx expo prebuild --platform android --non-interactive
          fi

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          if [[ "${{ steps.project.outputs.is_expo }}" == "true" ]]; then
            EXPO_ANDROID="${{ steps.project.outputs.package_dir }}/android"
            if [[ -f "$EXPO_ANDROID/settings.gradle" || -f "$EXPO_ANDROID/settings.gradle.kts" ]]; then
              PROJECT_DIR="$EXPO_ANDROID"
            fi
          fi

          if [[ ! -d "$PROJECT_DIR" ]]; then
            echo "::error::Android/Gradle project directory not found: $PROJECT_DIR"
            exit 1
          fi

          if [[ -f "$PROJECT_DIR/gradlew" ]]; then
            chmod +x "$PROJECT_DIR/gradlew"
            (cd "$PROJECT_DIR" && ./gradlew --no-daemon --stacktrace assembleDebug)
          elif [[ -f "$PROJECT_DIR/settings.gradle" || -f "$PROJECT_DIR/settings.gradle.kts" ]]; then
            (cd "$PROJECT_DIR" && gradle --no-daemon --stacktrace assembleDebug)
          else
            echo "::error::No Gradle settings file found. Cannot build an Android APK."
            exit 1
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          find source -type f -path '*/build/outputs/apk/*' -name '*.apk' -print
          APK_PATH="$(find source -type f -path '*/build/outputs/apk/*' -name '*.apk' -print -quit)"

          if [[ -z "$APK_PATH" ]]; then
            echo "::error::Gradle completed but no APK was found under build/outputs/apk."
            exit 1
          fi

          cp "$APK_PATH" artifacts/Dou-Expo-debug.apk
          sha256sum artifacts/Dou-Expo-debug.apk > artifacts/SHA256SUMS.txt
          ls -lh artifacts

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Dou-Expo-Android-APK
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
