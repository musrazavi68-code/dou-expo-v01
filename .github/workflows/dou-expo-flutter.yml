name: Build Dou Expo Flutter APK
on:
  push:
    branches: [dou-expo-flutter-beta-0.1.0]
    paths:
      - 'dou_expo_beta/**'
      - '.github/workflows/dou-expo-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter version
        run: flutter --version
      - name: Generate Android platform project
        working-directory: dou_expo_beta
        run: flutter create --platforms=android --project-name dou_expo_beta --org com.douexpo .
      - name: Resolve dependencies
        working-directory: dou_expo_beta
        run: flutter pub get
      - name: Analyze
        working-directory: dou_expo_beta
        run: flutter analyze
      - name: Build release APK
        working-directory: dou_expo_beta
        run: flutter build apk --release
      - name: Package source ZIP
        run: zip -r dou_expo_beta.zip dou_expo_beta -x 'dou_expo_beta/build/*' 'dou_expo_beta/.dart_tool/*'
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Dou-Expo-Flutter-Source-ZIP
          path: dou_expo_beta.zip
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dou-Expo-Flutter-Beta-0.1.0-Release-APK
          path: dou_expo_beta/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
