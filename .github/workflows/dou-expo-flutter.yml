name: Build Dou Expo Flutter Android and iOS
on:
  push:
    branches: [dou-expo-flutter-beta-0.1.0]
    paths:
      - 'dou_expo_beta/**'
      - '.github/workflows/dou-expo-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dou-expo-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release:
    name: Android analysis, tests and release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Flutter and Java versions
        run: |
          flutter --version
          java -version
      - name: Generate Android and iOS platform projects
        working-directory: dou_expo_beta
        run: flutter create --platforms=android,ios --project-name dou_expo_beta --org com.douexpo .
      - name: Apply camera and photo library permissions
        working-directory: dou_expo_beta
        run: python3 tool/configure_permissions.py
      - name: Resolve dependencies
        working-directory: dou_expo_beta
        run: flutter pub get
      - name: Analyze
        working-directory: dou_expo_beta
        run: flutter analyze --fatal-infos
      - name: Run tests
        working-directory: dou_expo_beta
        run: flutter test --reporter expanded
      - name: Build release APK
        working-directory: dou_expo_beta
        run: flutter build apk --release
      - name: Verify and checksum outputs
        working-directory: dou_expo_beta
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk
      - name: Package source ZIP
        run: |
          zip -r dou_expo_beta_v0.2.1.zip dou_expo_beta \
            -x 'dou_expo_beta/build/*' 'dou_expo_beta/.dart_tool/*'
          test -s dou_expo_beta_v0.2.1.zip
          sha256sum dou_expo_beta_v0.2.1.zip
      - name: Upload source ZIP
        uses: actions/upload-artifact@v6
        with:
          name: Dou-Expo-Beta-v0.2.1-Source-ZIP
          path: dou_expo_beta_v0.2.1.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Dou-Expo-Beta-v0.2.1-Release-APK
          path: dou_expo_beta/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90

  ios-compile:
    name: iOS compile validation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Generate iOS platform project
        working-directory: dou_expo_beta
        run: flutter create --platforms=ios --project-name dou_expo_beta --org com.douexpo .
      - name: Apply iOS permissions
        working-directory: dou_expo_beta
        run: python3 tool/configure_permissions.py
      - name: Resolve dependencies
        working-directory: dou_expo_beta
        run: flutter pub get
      - name: Build iOS without code signing
        working-directory: dou_expo_beta
        run: flutter build ios --release --no-codesign
