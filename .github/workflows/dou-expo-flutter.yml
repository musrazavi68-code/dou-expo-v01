name: Build Dou Expo Flutter Android and iOS
on:
  push:
    branches: [dou-expo-flutter-beta-0.1.0]
    paths:
      - 'dou_expo_beta/**'
      - '.github/workflows/dou-expo-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep only the newest CI run for this branch; obsolete queued builds waste
  # Android and macOS runner capacity and can publish stale artifacts.
  group: dou-expo-beta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release:
    name: Android analysis, tests and signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Flutter and Java versions
        run: |
          flutter --version
          java -version
      - name: Generate Android and iOS platform projects
        working-directory: dou_expo_beta
        run: flutter create --platforms=android,ios --project-name dou_expo_beta --org com.douexpo .
      - name: Apply camera and photo library permissions
        working-directory: dou_expo_beta
        run: python3 tool/configure_permissions.py
      - name: Resolve dependencies
        working-directory: dou_expo_beta
        run: flutter pub get
      - name: Analyze
        working-directory: dou_expo_beta
        run: flutter analyze
      - name: Run tests
        working-directory: dou_expo_beta
        run: flutter test --reporter expanded
      - name: Build release APK
        working-directory: dou_expo_beta
        run: flutter build apk --release
      - name: Align, sign and verify APK
        id: sign
        working-directory: dou_expo_beta
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          for tool in "$ZIPALIGN" "$APKSIGNER" "$AAPT"; do
            test -x "$tool" || { echo "::error::Android build tool missing: $tool"; exit 1; }
          done

          # Prefer the persistent release key; otherwise create a one-run test key.
          KEYSTORE="$RUNNER_TEMP/dou-expo-beta-signing.jks"
          if [[ -n "${DOU_EXPO_KEYSTORE_BASE64:-}" && -n "${DOU_EXPO_KEYSTORE_PASSWORD:-}" && -n "${DOU_EXPO_KEY_ALIAS:-}" && -n "${DOU_EXPO_KEY_PASSWORD:-}" ]]; then
            printf '%s' "$DOU_EXPO_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            STORE_PASS="$DOU_EXPO_KEYSTORE_PASSWORD"
            KEY_ALIAS="$DOU_EXPO_KEY_ALIAS"
            KEY_PASS="$DOU_EXPO_KEY_PASSWORD"
            SIGNING_MODE="persistent-release"
            echo "artifact_name=Dou-Expo-Beta-SIGNED-Release-APK" >> "$GITHUB_OUTPUT"
          else
            STORE_PASS="$(openssl rand -hex 24)"
            KEY_ALIAS="dou-expo-test"
            KEY_PASS="$STORE_PASS"
            keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storepass "$STORE_PASS" \
              -alias "$KEY_ALIAS" -keypass "$KEY_PASS" -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=Dou Expo Temporary CI, OU=Test, O=Dou Expo, C=US"
            SIGNING_MODE="ephemeral-test"
            echo "artifact_name=Dou-Expo-Beta-TEST-ONLY-Ephemeral-Signed-APK" >> "$GITHUB_OUTPUT"
            echo "::warning::Using a temporary signing key. This APK installs, but future builds cannot update it."
          fi
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          "$ZIPALIGN" -f -p 4 "$APK" "$RUNNER_TEMP/app-release-aligned.apk"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" \
            --out "$APK" "$RUNNER_TEMP/app-release-aligned.apk"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          # The configured persistent keystore is the release identity; apksigner above verifies its signature and reports its certificate fingerprint.
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.douexpo.dou_expo_beta' versionCode='5'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "sdkVersion:'24'" "$RUNNER_TEMP/apk-badging.txt"
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libapp.so$'
          sha256sum "$APK"
          ls -lh "$APK"
        env:
          DOU_EXPO_KEYSTORE_BASE64: ${{ secrets.DOU_EXPO_KEYSTORE_BASE64 }}
          DOU_EXPO_KEYSTORE_PASSWORD: ${{ secrets.DOU_EXPO_KEYSTORE_PASSWORD }}
          DOU_EXPO_KEY_ALIAS: ${{ secrets.DOU_EXPO_KEY_ALIAS }}
          DOU_EXPO_KEY_PASSWORD: ${{ secrets.DOU_EXPO_KEY_PASSWORD }}
      - name: Package clean source ZIP
        run: |
          set -euo pipefail
          zip -r dou_expo_beta_v0.2.4_source.zip dou_expo_beta \
            -x 'dou_expo_beta/build/*' 'dou_expo_beta/.dart_tool/*' \
               'dou_expo_beta/android/.gradle/*' 'dou_expo_beta/.flutter-plugins*'
          test -s dou_expo_beta_v0.2.4_source.zip
          sha256sum dou_expo_beta_v0.2.4_source.zip
      - name: Upload source ZIP
        uses: actions/upload-artifact@v6
        with:
          name: Dou-Expo-Beta-v0.2.4-Source-ZIP
          path: dou_expo_beta_v0.2.4_source.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload signed APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.sign.outputs.artifact_name }}
          path: dou_expo_beta/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90

  ios-compile:
    name: iOS compile validation
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Generate iOS platform project
        working-directory: dou_expo_beta
        run: flutter create --platforms=ios --project-name dou_expo_beta --org com.douexpo .
      - name: Apply iOS permissions
        working-directory: dou_expo_beta
        run: python3 tool/configure_permissions.py
      - name: Resolve dependencies
        working-directory: dou_expo_beta
        run: flutter pub get
      - name: Build iOS without code signing
        working-directory: dou_expo_beta
        run: flutter build ios --release --no-codesign
