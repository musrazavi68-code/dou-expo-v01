name: Build Dou Expo Flutter Android and iOS
on:
  push:
    branches: [dou-expo-flutter-beta-0.1.0]
    paths:
      - 'dou_expo_beta/**'
      - '.github/workflows/dou-expo-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dou-expo-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release:
    name: Android analysis, tests and signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Flutter and Java versions
        run: |
          flutter --version
          java -version
      - name: Generate Android and iOS platform projects
        working-directory: dou_expo_beta
        run: flutter create --platforms=android,ios --project-name dou_expo_beta --org com.douexpo .
      - name: Apply camera and photo library permissions
        working-directory: dou_expo_beta
        run: python3 tool/configure_permissions.py
      - name: Resolve dependencies
        working-directory: dou_expo_beta
        run: flutter pub get
      - name: Analyze
        working-directory: dou_expo_beta
        run: flutter analyze
      - name: Run tests
        working-directory: dou_expo_beta
        run: flutter test --reporter expanded
      - name: Build release APK
        working-directory: dou_expo_beta
        run: flutter build apk --release
      - name: Align, sign and verify APK
        working-directory: dou_expo_beta
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          for tool in "$ZIPALIGN" "$APKSIGNER" "$AAPT"; do
            test -x "$tool" || { echo "::error::Android build tool missing: $tool"; exit 1; }
          done

          # Use one persistent private key so Android accepts future APKs as updates.
          : "${DOU_EXPO_KEYSTORE_BASE64:?Set repository secret DOU_EXPO_KEYSTORE_BASE64}"
          : "${DOU_EXPO_KEYSTORE_PASSWORD:?Set repository secret DOU_EXPO_KEYSTORE_PASSWORD}"
          : "${DOU_EXPO_KEY_ALIAS:?Set repository secret DOU_EXPO_KEY_ALIAS}"
          : "${DOU_EXPO_KEY_PASSWORD:?Set repository secret DOU_EXPO_KEY_PASSWORD}"
          KEYSTORE="$RUNNER_TEMP/dou-expo-beta-signing.jks"
          printf '%s' "$DOU_EXPO_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          "$ZIPALIGN" -f -p 4 "$APK" "$RUNNER_TEMP/app-release-aligned.apk"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$DOU_EXPO_KEY_ALIAS" \
            --ks-pass "pass:$DOU_EXPO_KEYSTORE_PASSWORD" --key-pass "pass:$DOU_EXPO_KEY_PASSWORD" \
            --out "$APK" "$RUNNER_TEMP/app-release-aligned.apk"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | grep -Fqi "F5:AB:B7:F6:56:FE:95:F8:3E:68:C2:0A:7D:8A:CF:5A:A6:73:91:89:C6:ED:E2:47:C5:F6:18:46:83:04:AF:C5" || { echo "::error::APK signing certificate does not match the pinned Dou Expo beta key"; exit 1; }
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.douexpo.dou_expo_beta' versionCode='4'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "sdkVersion:'24'" "$RUNNER_TEMP/apk-badging.txt"
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libapp.so$'
          sha256sum "$APK"
          ls -lh "$APK"
        env:
          DOU_EXPO_KEYSTORE_BASE64: ${{ secrets.DOU_EXPO_KEYSTORE_BASE64 }}
          DOU_EXPO_KEYSTORE_PASSWORD: ${{ secrets.DOU_EXPO_KEYSTORE_PASSWORD }}
          DOU_EXPO_KEY_ALIAS: ${{ secrets.DOU_EXPO_KEY_ALIAS }}
          DOU_EXPO_KEY_PASSWORD: ${{ secrets.DOU_EXPO_KEY_PASSWORD }}
      - name: Package clean source ZIP
        run: |
          set -euo pipefail
          zip -r dou_expo_beta_v0.2.3_source.zip dou_expo_beta \
            -x 'dou_expo_beta/build/*' 'dou_expo_beta/.dart_tool/*' \
               'dou_expo_beta/android/.gradle/*' 'dou_expo_beta/.flutter-plugins*'
          test -s dou_expo_beta_v0.2.3_source.zip
          sha256sum dou_expo_beta_v0.2.3_source.zip
      - name: Upload source ZIP
        uses: actions/upload-artifact@v6
        with:
          name: Dou-Expo-Beta-v0.2.3-Source-ZIP
          path: dou_expo_beta_v0.2.3_source.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload signed APK
        uses: actions/upload-artifact@v6
        with:
          name: Dou-Expo-Beta-v0.2.3-SIGNED-Release-APK
          path: dou_expo_beta/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90

  ios-compile:
    name: iOS compile validation
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Generate iOS platform project
        working-directory: dou_expo_beta
        run: flutter create --platforms=ios --project-name dou_expo_beta --org com.douexpo .
      - name: Apply iOS permissions
        working-directory: dou_expo_beta
        run: python3 tool/configure_permissions.py
      - name: Resolve dependencies
        working-directory: dou_expo_beta
        run: flutter pub get
      - name: Build iOS without code signing
        working-directory: dou_expo_beta
        run: flutter build ios --release --no-codesign
