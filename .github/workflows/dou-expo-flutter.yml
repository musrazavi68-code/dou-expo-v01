name: Build Dou Expo Flutter Android and iOS
on:
  push:
    branches: [dou-expo-flutter-beta-0.1.0]
    paths:
      - 'dou_expo_beta/**'
      - '.github/workflows/dou-expo-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dou-expo-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release:
    name: Android analysis, tests and signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Flutter and Java versions
        run: |
          flutter --version
          java -version
      - name: Generate Android and iOS platform projects
        working-directory: dou_expo_beta
        run: flutter create --platforms=android,ios --project-name dou_expo_beta --org com.douexpo .
      - name: Apply camera and photo library permissions
        working-directory: dou_expo_beta
        run: python3 tool/configure_permissions.py
      - name: Resolve dependencies
        working-directory: dou_expo_beta
        run: flutter pub get
      - name: Analyze
        working-directory: dou_expo_beta
        run: flutter analyze --fatal-infos
      - name: Run tests
        working-directory: dou_expo_beta
        run: flutter test --reporter expanded
      - name: Build release APK
        working-directory: dou_expo_beta
        run: flutter build apk --release
      - name: Align, sign and verify APK
        working-directory: dou_expo_beta
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          for tool in "$ZIPALIGN" "$APKSIGNER" "$AAPT"; do
            test -x "$tool" || { echo "::error::Android build tool missing: $tool"; exit 1; }
          done

          # Create a beta-only signing key. A release-signed APK is required by Android Package Manager.
          KEYSTORE="$RUNNER_TEMP/dou-expo-beta-signing.jks"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass douexpo-beta -alias douexpo \
            -keypass douexpo-beta -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Dou Expo Beta, OU=Beta, O=Dou Expo, L=Montreal, ST=Quebec, C=CA"
          "$ZIPALIGN" -f -p 4 "$APK" "$RUNNER_TEMP/app-release-aligned.apk"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias douexpo \
            --ks-pass pass:douexpo-beta --key-pass pass:douexpo-beta \
            --out "$APK" "$RUNNER_TEMP/app-release-aligned.apk"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.douexpo.dou_expo_beta' versionCode='3'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "sdkVersion:'24'" "$RUNNER_TEMP/apk-badging.txt"
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libapp.so$'
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Package clean source ZIP
        run: |
          set -euo pipefail
          zip -r dou_expo_beta_v0.2.2_source.zip dou_expo_beta \
            -x 'dou_expo_beta/build/*' 'dou_expo_beta/.dart_tool/*' \
               'dou_expo_beta/android/.gradle/*' 'dou_expo_beta/.flutter-plugins*'
          test -s dou_expo_beta_v0.2.2_source.zip
          sha256sum dou_expo_beta_v0.2.2_source.zip
      - name: Upload source ZIP
        uses: actions/upload-artifact@v6
        with:
          name: Dou-Expo-Beta-v0.2.2-Source-ZIP
          path: dou_expo_beta_v0.2.2_source.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload signed APK
        uses: actions/upload-artifact@v6
        with:
          name: Dou-Expo-Beta-v0.2.2-SIGNED-Release-APK
          path: dou_expo_beta/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90

  ios-compile:
    name: iOS compile validation
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Generate iOS platform project
        working-directory: dou_expo_beta
        run: flutter create --platforms=ios --project-name dou_expo_beta --org com.douexpo .
      - name: Apply iOS permissions
        working-directory: dou_expo_beta
        run: python3 tool/configure_permissions.py
      - name: Resolve dependencies
        working-directory: dou_expo_beta
        run: flutter pub get
      - name: Build iOS without code signing
        working-directory: dou_expo_beta
        run: flutter build ios --release --no-codesign
