name: Build Dou Expo Flutter APK
on:
  push:
    branches: [dou-expo-flutter-beta-0.1.0]
    paths:
      - 'dou_expo_beta/**'
      - '.github/workflows/dou-expo-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter version
        run: flutter --version
      - name: Generate Android and iOS platform projects
        working-directory: dou_expo_beta
        run: flutter create --platforms=android,ios --project-name dou_expo_beta --org com.douexpo .
      - name: Apply camera and photo library permissions
        working-directory: dou_expo_beta
        run: python3 tool/configure_permissions.py
      - name: Resolve dependencies
        working-directory: dou_expo_beta
        run: flutter pub get
      - name: Analyze
        working-directory: dou_expo_beta
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        working-directory: dou_expo_beta
        run: flutter test
      - name: Build release APK
        working-directory: dou_expo_beta
        run: flutter build apk --release
      - name: Package source ZIP
        run: zip -r dou_expo_beta_v0.2.zip dou_expo_beta -x 'dou_expo_beta/build/*' 'dou_expo_beta/.dart_tool/*'
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Dou-Expo-Beta-v0.2-Source-ZIP
          path: dou_expo_beta_v0.2.zip
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dou-Expo-Beta-v0.2-Release-APK
          path: dou_expo_beta/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
